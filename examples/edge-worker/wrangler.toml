# Minimal Cloudflare Worker driving a `harness serve` bridge through
# @graff-new/sdk/remote. Local check (no deploy, real workerd runtime):
#   harness serve --port 8926 --token edge-test     # terminal 1
#   npx wrangler dev --port 8970                    # terminal 2
#   curl http://127.0.0.1:8970
# For a real deploy, point BRIDGE_URL at a TLS-fronted bridge and put the
# token in a secret: npx wrangler secret put BRIDGE_TOKEN
name = "harness-edge-worker"
main = "src/index.ts"
compatibility_date = "2026-04-01"

[vars]
BRIDGE_URL = "http://127.0.0.1:8926"
