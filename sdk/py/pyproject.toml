[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codegraff"
version = "0.3.1"
readme = "README.md"
description = "Python client for the codegraff agent — drives `graff --json` over stdio. Constants auto-generated from `graff --schema`."
requires-python = ">=3.8"
license = { text = "BSD-3-Clause" }
keywords = ["codegraff", "graff", "agent", "llm", "harness", "sdk"]

[project.urls]
Homepage = "https://codegraff.com"
Repository = "https://github.com/justrach/codegraff"

[tool.setuptools]
py-modules = ["harness_sdk"]
