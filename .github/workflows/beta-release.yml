name: beta release

on:
  push:
    branches: ['release/v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# Publication is serialized across every release branch. The guard checks the
# remote head again after the builds, so queued work cannot revive an old beta.
concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.beta.outputs.build }}
      version: ${{ steps.beta.outputs.version }}
      tag: ${{ steps.beta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Select the latest release branch head
        id: beta
        run: |
          python3 scripts/beta-release.py plan \
            --branch "$GITHUB_REF_NAME" --sha "$GITHUB_SHA" \
            --run-number "$GITHUB_RUN_NUMBER" --run-attempt "$GITHUB_RUN_ATTEMPT"

  cli:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      # One runner per target instead of a serial six-target loop: wall time
      # drops from ~24 min to roughly a single release build (~4-5 min).
      # fail-fast stays on (the default) so a broken target cancels the rest
      # instead of publishing a partial set.
      matrix:
        target:
          - aarch64-macos
          - x86_64-macos
          - x86_64-linux
          - aarch64-linux
          - x86_64-windows
          - aarch64-windows
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-codegraff-zig
      - uses: ./.github/actions/setup-nanocompile
        with:
          target: ${{ matrix.target }}
          binary-base-url: ${{ secrets.NANOCOMPILE_BINARY_BASE_URL }}
      - name: Cross-compile beta CLI (${{ matrix.target }})
        env:
          BETA_VERSION: ${{ needs.plan.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          python3 scripts/build-release.py --target "$TARGET" --version "$BETA_VERSION" --verify-restore --portable-host
          name="graff-$TARGET"
          mkdir "$name"
          case "$TARGET" in *-windows) bin=graff.exe ;; *) bin=graff ;; esac
          cp "zig-out/$TARGET/bin/$bin" "$name/$bin"
          cp README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: beta-cli-${{ matrix.target }}
          path: graff-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # Builds run beside CI; nothing is published unless CI passed on this
  # exact push (scripts/wait-for-ci.py).
  ci-gate:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/wait-for-ci.py
          sparse-checkout-cone-mode: false
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/wait-for-ci.py --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --ref "$GITHUB_REF_NAME"

  publish:
    needs: [plan, cli, ci-gate]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: beta-cli-*
          path: beta-assets
          merge-multiple: true
      - name: Verify targets and checksums
        run: |
          set -euo pipefail
          for target in aarch64-macos x86_64-macos x86_64-linux aarch64-linux x86_64-windows aarch64-windows; do
            test -f "beta-assets/graff-$target.tar.gz" || { echo "missing beta-assets/graff-$target.tar.gz" >&2; exit 1; }
          done
          # Checksums are computed once, centrally, from the exact bytes
          # being uploaded — not per matrix job.
          (cd beta-assets && sha256sum graff-*.tar.gz > SHA256SUMS)
          cat beta-assets/SHA256SUMS
      - name: Recheck release branch head
        id: fresh
        run: python3 scripts/beta-release.py guard --branch "$GITHUB_REF_NAME" --sha "$GITHUB_SHA"
      - name: Prepare beta notes
        if: steps.fresh.outputs.publish == 'true'
        env:
          BETA_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          python3 scripts/beta-release.py notes \
            --branch "$GITHUB_REF_NAME" --sha "$GITHUB_SHA" \
            --tag "$BETA_TAG" --output beta-notes.md
      - name: Publish beta prerelease
        if: steps.fresh.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          test -f beta-assets/SHA256SUMS
          gh release create "$BETA_TAG" beta-assets/* \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "$BETA_TAG" --notes-file beta-notes.md
