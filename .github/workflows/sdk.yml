name: sdk

# Publish the committed SDKs to npm + PyPI via OIDC trusted publishing (no
# tokens) on every sdk-v* tag. Regenerate locally (python3 sdk/generate.py)
# before tagging — this ships sdk/ as committed.
on:
  push:
    tags: ["sdk-v*"]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PyPI first: if its trusted publisher isn't live, npm won't have shipped.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build + publish codegraff (PyPI, OIDC)
        working-directory: sdk/py
        run: |
          sed -i "s/^version = .*/version = \"${GITHUB_REF_NAME#sdk-v}\"/" pyproject.toml
          python3 -m pip install --quiet build
          python3 -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/py/dist
          skip-existing: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Publish @codegraff/sdk (npm, OIDC + provenance)
        working-directory: sdk/ts
        run: |
          npm install -g npm@latest
          npm version "${GITHUB_REF_NAME#sdk-v}" --no-git-tag-version --allow-same-version
          npm publish --access public
