name: desktop
on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/native/**', 'src/**', 'scripts/test-server-retention.py', 'scripts/eval/frontend_model.py', 'scripts/eval/mock_model.py', 'scripts/eval/test_mock_model.py', 'scripts/*zig-ci.py', '.github/actions/setup-codegraff-zig/**', '.github/workflows/desktop.yml']
  push:
    branches: [main, 'release/**']
    paths: ['apps/native/**', 'src/**', 'scripts/test-server-retention.py', 'scripts/eval/frontend_model.py', 'scripts/eval/mock_model.py', 'scripts/eval/test_mock_model.py', 'scripts/*zig-ci.py', '.github/actions/setup-codegraff-zig/**', '.github/workflows/desktop.yml']
permissions:
  contents: read

# Push already covers same-repo PRs whose head is main or release/*.
# Feature-branch PRs and forks still use pull_request. Cancel stacked runs on
# the same ref so macos runners are not queued behind a superseded SHA.
concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork || (github.event.pull_request.head.ref != 'main' && !startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: macos-14
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run test:desktop
      - name: Embedded browser WebAuthn dispatch (virtual authenticator)
        run: |
          if [ ! -f node_modules/electron/path.txt ]; then bun node_modules/electron/install.js; fi
          bun run test:webauthn
      - run: bun run build
      - run: bunx playwright install chromium
      - run: bun run test:keyboard
      - run: bun run test:queue
      - run: bun run test:turns
      - run: bun run test:tab-drag
      - run: bun run test:session-navigation
      - run: bun run test:stream-performance
      - run: bun run test:history-performance
      - run: bun run test:browser-resources
      - run: bun run test:overflow
      - run: bun run test:tasks
      - run: bun run test:links
      - run: bun run test:projects
      - run: bun run test:workspace
      - run: bun run test:stress
      - run: bun run test:agents
      - run: bun run test:sessions
      - run: bun build electron/updater-runtime.cjs --target=node --format=cjs --external electron --outfile /tmp/updater-runtime.cjs
  native:
    name: native macOS GUI
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork || (github.event.pull_request.head.ref != 'main' && !startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Offline model fixture without hostname resolution
        run: python3 scripts/eval/test_mock_model.py
        working-directory: .
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Native graphical session, Activity sheet and OS capabilities
        run: bun run test:native
        env:
          GRAFF_ELECTRON_FOREGROUND: '1'
      - run: bun run build
        id: gui
      - name: Foreground GUI suite including native fullscreen
        run: bun run test:visual
        env:
          GRAFF_ELECTRON_FOREGROUND: '1'
      - name: Foreground pointer tab drag and split regressions
        if: ${{ !cancelled() && steps.gui.conclusion == 'success' }}
        run: bun run test:tab-drag
        env:
          GRAFF_ELECTRON_FOREGROUND: '1'
          GRAFF_VISUAL_OUTPUT: ../../zig-out/native-tab-drag
      - name: Session navigation modes and sidebar drag
        if: ${{ !cancelled() && steps.gui.conclusion == 'success' }}
        run: bun run test:session-navigation
        env:
          GRAFF_ELECTRON_FOREGROUND: '1'
          GRAFF_VISUAL_OUTPUT: ../../zig-out/session-navigation
      - uses: ./.github/actions/setup-codegraff-zig
        id: zig
        if: ${{ !cancelled() && steps.gui.conclusion == 'success' }}
      - name: Build the actual ACP worker
        id: worker
        if: ${{ !cancelled() && steps.zig.conclusion == 'success' }}
        run: zig build
        working-directory: .
      - name: Worker replacement and retained listener lifecycle
        if: ${{ !cancelled() && steps.worker.conclusion == 'success' }}
        run: python3 scripts/test-server-retention.py --gui --evidence "$RUNNER_TEMP/server-retention-gui"
        working-directory: .
      - name: Production front-end failure and recovery with native input when permitted
        if: ${{ !cancelled() && steps.worker.conclusion == 'success' }}
        run: bun run test:frontend
        env:
          GRAFF_ELECTRON_FOREGROUND: '1'
          GRAFF_FRONTEND_OS_INPUT: '1'
      - name: Title failure fallback and successful recovery
        if: ${{ !cancelled() && steps.worker.conclusion == 'success' }}
        run: GRAFF_TITLE_RESULT_TEST=1 bun scripts/test-frontend.mjs
        env:
          GRAFF_FRONTEND_OUTPUT: ../../zig-out/title-result
      - name: Narrow-window navigation and saved chat actions
        if: ${{ !cancelled() && steps.worker.conclusion == 'success' }}
        run: bun run test:narrow-navigation
        env:
          GRAFF_FRONTEND_OUTPUT: ../../zig-out/narrow-navigation
      - name: Production inline HTML tool and saved replay
        if: ${{ !cancelled() && steps.worker.conclusion == 'success' }}
        run: bun run test:html-tool
        env:
          GRAFF_FRONTEND_OUTPUT: ../../zig-out/html-tool-test
      - name: Terminal project handoff into the production GUI
        if: ${{ !cancelled() && steps.worker.conclusion == 'success' }}
        run: bun run test:cli
        env:
          GRAFF_FRONTEND_OUTPUT: ../../zig-out/cli-test
      - name: Packaged conversation title creation and recovery
        id: packaged
        if: ${{ !cancelled() && steps.worker.conclusion == 'success' }}
        run: |
          GRAFF_REUSE_ENGINE=1 bun run electron:build
          bun run test:packaged-titles
        env:
          GRAFF_PACKAGED_OUTPUT: ../../zig-out/packaged-titles
      - name: Production desktop shutdown preserves retained servers
        if: ${{ !cancelled() && steps.packaged.conclusion == 'success' }}
        run: bun scripts/test-server-desktop.mjs
      - name: Bounded mixed split and memory stress
        if: ${{ !cancelled() && steps.worker.conclusion == 'success' }}
        run: bun run test:split-stress
        env:
          GRAFF_FRONTEND_OUTPUT: ../../zig-out/split-stress
      - name: Require native fullscreen coverage
        run: bun scripts/check-native-ci.mjs
      - name: Native coverage report
        if: always()
        run: bun scripts/check-native-ci.mjs --summary
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-gui-results
          path: |
            zig-out/html-tool-test/results.json
            zig-out/cli-test/
            zig-out/native-tests/native-results.json
            zig-out/frontend-tests/
            zig-out/narrow-navigation/
            zig-out/packaged-titles/
            zig-out/split-stress/
            zig-out/native-tab-drag/
            zig-out/session-navigation/
            zig-out/server-desktop/
            zig-out/visual-tests/test-run.json
            zig-out/visual-tests/stress-results.json
            zig-out/visual-tests/stress-fullscreen.png
          if-no-files-found: warn
          retention-days: 7
