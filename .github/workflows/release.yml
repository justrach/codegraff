name: release

# Pushing a tag like v0.2.0 cross-compiles harness for the four desktop
# targets and publishes a GitHub Release with tarballs + checksums. The
# version baked into `--version` comes from the tag via -Dversion.
on:
  push:
    tags: ["v*", "!v*-*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate stable release tag
        run: python3 scripts/check-release-tag.py "$GITHUB_REF_NAME"

      - name: Install Zig
        uses: ./.github/actions/setup-codegraff-zig

      - name: Cross-compile
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Release builds phone usage/evolution telemetry here by default
          # (anonymous, opt out with --no-telemetry / GRAFF_NO_TELEMETRY).
          TELEMETRY_ENDPOINT="https://harness-telemetry.rachpradhan.workers.dev"
          for target in aarch64-macos x86_64-macos x86_64-linux aarch64-linux x86_64-windows aarch64-windows; do
            zig build graff -Doptimize=ReleaseFast -Dtarget="$target" -Dversion="$VERSION" -Dtelemetry-endpoint="$TELEMETRY_ENDPOINT"
            name="graff-$target"
            mkdir "$name"
            # Windows targets emit graff.exe; every other target emits graff.
            case "$target" in
              *-windows) bin=graff.exe ;;
              *) bin=graff ;;
            esac
            cp "zig-out/bin/$bin" "$name/$bin"
            cp README.md LICENSE "$name/"
            tar -czf "$name.tar.gz" "$name"
            rm -r "$name"
          done
          sha256sum graff-*.tar.gz > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes preference: a hand-written docs/releases/<tag>.md wins, then
          # the tag's CHANGELOG.md section, then GitHub's generated PR list.
          notes=(--generate-notes)
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          section="$(awk -v tag="${GITHUB_REF_NAME}" '
            $1 == "##" && $2 == tag { hit = 1; next }
            /^## / { hit = 0 }
            hit { print }
          ' CHANGELOG.md 2>/dev/null || true)"
          if [ -f "$notes_file" ]; then
            notes=(--notes-file "$notes_file")
          elif [ -n "$section" ]; then
            printf '%s\n' "$section" > changelog-notes.md
            notes=(--notes-file changelog-notes.md)
          fi
          assets=(graff-*.tar.gz SHA256SUMS install.sh)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # A maintainer may publish the notes while cross-compilation is still
            # running. Attach to that release instead of creating an untagged draft.
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "$GITHUB_REF_NAME" --draft "${notes[@]}"
          fi

          uploaded="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          for asset in "${assets[@]}"; do
            grep -Fxq "$(basename "$asset")" <<<"$uploaded" || {
              echo "release is missing asset: $asset" >&2
              exit 1
            }
          done

  # Linux desktop package. macOS stays a notarized upload from a Mac
  # (publish-updates.sh). This runner can build the unsigned .deb the
  # packager already writes; signing is not a gate (ADR 0157).
  desktop-linux:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Validate stable release tag
        run: python3 scripts/check-release-tag.py "$GITHUB_REF_NAME"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: ./.github/actions/setup-codegraff-zig
      - name: Package the Linux desktop
        run: |
          set -euo pipefail
          GRAFF_VERSION="${GITHUB_REF_NAME#v}" bash apps/native/electron/build.sh
      - name: Upload the Linux desktop package
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash apps/native/electron/publish-linux.sh "$GITHUB_REF_NAME" zig-out/electron
