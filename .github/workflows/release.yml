name: release

# Pushing a tag like v0.2.0 cross-compiles harness for the six release
# targets and publishes a draft GitHub Release with tarballs + checksums. The
# version baked into `--version` comes from the tag via -Dversion.
#
# The two macOS CLI binaries are Developer ID signed and notarized on a macOS
# runner BEFORE anything is uploaded (ADR 0210), so the release only ever
# receives final bytes and SHA256SUMS is computed once from them. That needs
# all five repository secrets:
#   MACOS_CERT_P12 / MACOS_CERT_PASSWORD - base64 "Developer ID Application"
#     certificate + private key (.p12) and its export password.
#   AC_API_KEY_P8 / AC_API_KEY_ID / AC_API_ISSUER_ID - App Store Connect API
#     key (raw .p8 contents) for notarytool.
# Without them the signing job succeeds as a no-op, the release carries the
# unsigned macOS tarballs, and docs/notarization.md is the manual fallback.
on:
  push:
    tags: ["v*", "!v*-*"]

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # One runner per target instead of a serial six-target loop: wall time
      # drops from ~24 min to roughly a single ReleaseFast build (~4-5 min).
      # fail-fast stays on (the default) so a broken target cancels the rest
      # instead of publishing a partial set.
      matrix:
        target:
          - aarch64-macos
          - x86_64-macos
          - x86_64-linux
          - aarch64-linux
          - x86_64-windows
          - aarch64-windows
    steps:
      - uses: actions/checkout@v7

      - name: Validate stable release tag
        run: python3 scripts/check-release-tag.py "$GITHUB_REF_NAME"

      - name: Install Zig
        uses: ./.github/actions/setup-codegraff-zig

      - uses: ./.github/actions/setup-nanocompile
        with:
          target: ${{ matrix.target }}
          binary-base-url: ${{ secrets.NANOCOMPILE_BINARY_BASE_URL }}

      - name: Cross-compile (${{ matrix.target }})
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Release builds phone usage/evolution telemetry here by default
          # (anonymous, opt out with --no-telemetry / GRAFF_NO_TELEMETRY).
          TELEMETRY_ENDPOINT="https://harness-telemetry.rachpradhan.workers.dev"
          python3 scripts/build-release.py --target "$TARGET" --version "$VERSION" --telemetry-endpoint "$TELEMETRY_ENDPOINT" --verify-restore --portable-host
          name="graff-$TARGET"
          mkdir "$name"
          # Windows targets emit graff.exe; every other target emits graff.
          case "$TARGET" in
            *-windows) bin=graff.exe ;;
            *) bin=graff ;;
          esac
          cp "zig-out/$TARGET/bin/$bin" "$name/$bin"
          cp README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: cli-tarballs-${{ matrix.target }}
          path: graff-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # Sign + notarize the macOS CLI binaries, exactly as docs/notarization.md
  # does by hand. No-op (success) unless all five secrets are configured.
  macos-sign:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    steps:
      - name: Select signed distribution path
        id: signing
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          if [[ -n "$MACOS_CERT_P12" && -n "$MACOS_CERT_PASSWORD" && \
                -n "$AC_API_KEY_P8" && -n "$AC_API_KEY_ID" && \
                -n "$AC_API_ISSUER_ID" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            msg='macOS signing secrets are not all set; the release keeps the unsigned macOS tarballs. Sign them by hand per docs/notarization.md.'
            echo "::notice::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The per-target signing script; checked out before the download so the
      # checkout does not clean the downloaded tarballs away.
      - uses: actions/checkout@v7
        if: steps.signing.outputs.enabled == 'true'
        with:
          sparse-checkout: scripts/release-sign-macos.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v7
        if: steps.signing.outputs.enabled == 'true'
        with:
          pattern: cli-tarballs-*
          path: dist
          merge-multiple: true

      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release.keychain-db"
          pass="$(openssl rand -hex 16)"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 -d >"$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # Allow codesign to use the imported key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          [ -n "$identity" ] || { echo "p12 contains no Developer ID Application identity" >&2; exit 1; }
          echo "Signing as: $identity"
          echo "CODESIGN_IDENTITY=$identity" >>"$GITHUB_ENV"

      - name: Write the notary key
        if: steps.signing.outputs.enabled == 'true'
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
        run: printf '%s' "$AC_API_KEY_P8" >"$RUNNER_TEMP/ac_api_key.p8"

      # Each notarization waits minutes on the notary service; the two
      # targets wait side by side instead of one after the other.
      - parallel:
          - name: Sign and notarize aarch64-macos
            if: steps.signing.outputs.enabled == 'true'
            env:
              AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
              AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
            run: scripts/release-sign-macos.sh aarch64-macos
          - name: Sign and notarize x86_64-macos
            if: steps.signing.outputs.enabled == 'true'
            env:
              AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
              AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
            run: scripts/release-sign-macos.sh x86_64-macos

      - name: Verify like a user
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          check="$(mktemp -d)"
          for target in aarch64-macos x86_64-macos; do
            name="graff-$target"
            # Same member layout as the Linux-built tarball, no AppleDouble files.
            members="$(tar -tzf "signed/$name.tar.gz" | sed 's:/$::' | LC_ALL=C sort | tr '\n' ' ')"
            [ "$members" = "$name $name/LICENSE $name/README.md $name/graff " ] \
              || { echo "$name: unexpected tarball members: $members" >&2; exit 1; }
            tar -xzf "signed/$name.tar.gz" -C "$check"
            codesign --verify --strict "$check/$name/graff"
            info="$(codesign -dv --verbose=2 "$check/$name/graff" 2>&1)"
            grep -q 'Authority=Developer ID Application' <<<"$info"
            grep -q 'flags=.*runtime' <<<"$info"
          done
          shasum -a 256 signed/*.tar.gz

      - uses: actions/upload-artifact@v7
        if: steps.signing.outputs.enabled == 'true'
        with:
          name: cli-macos-signed
          path: signed/*.tar.gz
          if-no-files-found: error

      - name: Remove signing keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/ac_api_key.p8"

  # Builds run beside CI; nothing is published unless CI passed on this
  # exact push (scripts/wait-for-ci.py).
  ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/wait-for-ci.py
          sparse-checkout-cone-mode: false
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/wait-for-ci.py --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --ref "$GITHUB_REF_NAME"

  release:
    needs: [build, macos-sign, ci-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: cli-tarballs-*
          path: .
          merge-multiple: true

      - uses: actions/download-artifact@v7
        if: needs.macos-sign.outputs.signed == 'true'
        with:
          name: cli-macos-signed
          path: signed-macos

      - name: Assemble final assets and checksums
        env:
          SIGNED: ${{ needs.macos-sign.outputs.signed }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" = true ]; then
            for target in aarch64-macos x86_64-macos; do
              mv -f "signed-macos/graff-$target.tar.gz" "graff-$target.tar.gz"
            done
            echo 'macOS CLI tarballs: Developer ID signed and notarized in CI.' >>"$GITHUB_STEP_SUMMARY"
          else
            echo 'macOS CLI tarballs: UNSIGNED. Finish them with docs/notarization.md before publishing.' >>"$GITHUB_STEP_SUMMARY"
          fi
          for target in aarch64-macos x86_64-macos x86_64-linux aarch64-linux x86_64-windows aarch64-windows; do
            test -f "graff-$target.tar.gz" || { echo "missing graff-$target.tar.gz" >&2; exit 1; }
          done
          # Computed once, from the exact bytes being uploaded.
          sha256sum graff-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes preference: a hand-written docs/releases/<tag>.md wins, then
          # the tag's CHANGELOG.md section, then GitHub's generated PR list.
          notes=(--generate-notes)
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          section="$(awk -v tag="${GITHUB_REF_NAME}" '
            $1 == "##" && $2 == tag { hit = 1; next }
            /^## / { hit = 0 }
            hit { print }
          ' CHANGELOG.md 2>/dev/null || true)"
          if [ -f "$notes_file" ]; then
            notes=(--notes-file "$notes_file")
          elif [ -n "$section" ]; then
            printf '%s\n' "$section" > changelog-notes.md
            notes=(--notes-file changelog-notes.md)
          fi
          assets=(graff-*.tar.gz SHA256SUMS install.sh install.ps1)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # A maintainer may publish the notes while cross-compilation is still
            # running. Attach to that release instead of creating an untagged draft.
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "$GITHUB_REF_NAME" --draft "${notes[@]}"
          fi

          uploaded="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          for asset in "${assets[@]}"; do
            grep -Fxq "$(basename "$asset")" <<<"$uploaded" || {
              echo "release is missing asset: $asset" >&2
              exit 1
            }
          done

