# This crate is its own workspace root: it lives inside the codegraff repo but
# is decoupled from the root cargo workspace. The empty [workspace] table stops
# cargo from walking up into codegraff's root workspace while keeping GUI build
# artifacts and lockfiles local to gui/src-tauri.
[workspace]

[package]
name = "codegraff-gui"
version = "0.0.166"
description = "Desktop coding agent interface powered by Codegraff"
authors = ["Codegraff contributors"]
license = "Apache-2.0"
repository = "https://github.com/justrach/codegraff"
edition = "2024"
rust-version = "1.92"
default-run = "codegraff-gui"

[lib]
name = "codegraff_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
bstr = "1.12"
bytes = "1.10"
diesel = { version = "2.3.7", features = ["sqlite"] }
futures = "0.3"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "hickory-dns", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
roxmltree = "0.20"
similar = "3.1.0"
tauri = { version = "2.10.3", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1.51.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tonic = { version = "0.14.5", features = ["tls-webpki-roots"] }
ts-rs = "12.0.1"
url = { version = "2.5.8", features = ["serde"] }
urlencoding = "2.1.3"
uuid = { version = "1.23.0", features = ["v4", "serde"] }
portable-pty = "0.9.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
base64 = "0.22"
tiny_http = "0.12"

[dev-dependencies]
pretty_assertions = "1.4.1"
