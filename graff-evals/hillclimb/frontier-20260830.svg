  <circle cx="28" cy="430" r="6" fill="#059669" stroke="#047857" stroke-width="1.4"/>
  <text x="40" y="434" font-size="12" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif">graff-dev (−p) — on the 5-axis frontier via wall / tokens / list$ / RSS</text>
  <circle cx="28" cy="450" r="6" fill="#334155" stroke="#1e293b" stroke-width="1.4"/>
  <text x="40" y="454" font-size="12" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif">grok-build — on the 5-axis frontier via fewer calls (7 vs 8 / 9)</text>
  <circle cx="500" cy="430" r="5.5" fill="#ffffff" stroke="#64748b" stroke-width="1.6" stroke-dasharray="2.5 2"/>
  <text x="512" y="434" font-size="12" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif">graff-dev-repl — interior (dominated by −p)</text>
  <line x1="500" y1="450" x2="528" y2="450" stroke="#059669" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="536" y="454" font-size="12" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif">2D frontier (calls vs $)</text>
