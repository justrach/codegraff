  <polyline points="564,106 670,282" fill="none" stroke="#059669" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.85"/>

  <!--
    Coordinates from the live JSONL sums (wall 22.17 / 36.97 / 25.23;
    list$ 0.03741 / 0.14735 / 0.11855; calls 8 / 7 / 9).
    x_wall = 72 + (wall-18)/(41-18)*340
