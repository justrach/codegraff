<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="t d">
  <title id="t">Pareto projections of the live 3-task set (run-20260830-042417)</title>
  <desc id="d">Two minimize-minimize scatter plots from graff-evals/results/run-20260830-042417.jsonl. Left: wall seconds vs list-price USD — only graff-dev is on that 2D frontier. Right: tool calls vs list-price USD — grok-build (fewer calls) and graff-dev (cheaper) are on the frontier; graff-dev-repl is interior, dominated by -p. REPL first-token is composer echo and is not an axis. The 5-axis score is not strict Pareto: grok still wins calls.</desc>
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="20" y="22" font-size="16" font-weight="700" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif">Live 3-task frontier · run-20260830-042417 · lower-left is better</text>
  <text x="20" y="40" font-size="11" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif">Pass is 3/3 all around. REPL first-token (0.03s) is composer echo — not plotted. Not strict Pareto on the 5-axis score: grok still wins calls.</text>

